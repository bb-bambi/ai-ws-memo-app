services:
  - type: web
    name: memo-app-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: memo-app-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://memo-app-frontend.onrender.com

  - type: web
    name: memo-app-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: memo-app-backend
          type: web
          property: host

databases:
  - name: memo-app-db
    plan: free
